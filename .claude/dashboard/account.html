<!doctype html>
<!-- SPDX-License-Identifier: Apache-2.0 -->
<html lang="en" data-motion="on" data-density="comfortable">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Only sibling files load; the page reads and writes /me and /users of its own host, and its head reads the Board's data.js and live feed. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'none'; connect-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="color-scheme" content="light dark">
<title>Conveyor: account and users</title>
<link rel="stylesheet" href="app.css">
<link rel="icon" type="image/svg+xml" href="icon.svg">
</head>
<body>
<!-- The Board's own head (index.html's), drawn by app.js and head.js from the same data: the tiles, the status mark,
     the times and the tabs, each tab a link back to the Board. -->
<header class="top">
  <div class="brand">
    <svg class="brand-mark" aria-hidden="true" viewBox="0 0 64 64">
      <defs><linearGradient id="cv" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b8cf8"/><stop offset="1" stop-color="#4ade80"/></linearGradient></defs>
      <rect x="1.5" y="1.5" width="61" height="61" rx="17" fill="#151821" stroke="url(#cv)" stroke-width="3"/>
      <path d="M42.5 20.5A16 16 0 1 0 42.5 43.5" fill="none" stroke="url(#cv)" stroke-width="7.5" stroke-linecap="round"/>
      <rect x="35" y="26.5" width="16" height="11" rx="3" fill="#4ade80"/>
    </svg>
    <h1><span class="word"><span class="belt" aria-hidden="true"></span><span class="roller l" aria-hidden="true"></span><span class="roller r" aria-hidden="true"></span><span class="lane" aria-hidden="true"><span class="parcel"></span></span><span class="w">Conveyor</span></span> <span class="brand-sub">Board</span></h1>
  </div>
  <nav id="stats" class="stats" aria-label="At a glance"></nav>
  <div class="top-meta">
    <span id="status" class="status" role="status"><span class="chip chip-quiet"><span>Loading</span></span></span>
    <span id="new-view" class="new-view" hidden>New version. <button type="button" id="reload" class="btn btn-quiet">Reload</button></span>
    <span class="meta">Updated <span id="updated">never</span></span>
    <span class="meta"><time id="clock">--:--</time></span>
  </div>
  <div class="top-actions">
    <button type="button" class="btn top-menu" aria-expanded="false" aria-controls="top-menu-list">Menu</button>
    <div class="top-menu-list" id="top-menu-list">
      <a class="btn btn-quiet" href="account.html" aria-current="page">Account</a>
      <button type="button" id="restart" class="btn btn-quiet" hidden>Restart the Board's feed</button>
    </div>
  </div>
</header>
<nav id="tabs" class="tabs" aria-label="Dashboard views"></nav>
<p id="restart-note" class="note" role="status"></p>
<p id="banner" class="banner" role="alert" hidden></p>
<p id="announce" class="sr-only" aria-live="polite"></p>
<p id="note" class="note" role="status"></p>
<!-- account.js fills the panels. The Users panel and "No login on this device" stay hidden until the server says this
     user is an admin. -->
<main class="grid">
  <section id="panel-me" class="panel" data-size="full" aria-labelledby="panel-me-title">
    <header class="panel-head"><h2 id="panel-me-title" class="panel-title">Your account</h2></header>
    <div id="me-body" class="panel-body"></div>
  </section>
  <section id="panel-users" class="panel" data-size="full" aria-labelledby="panel-users-title" hidden>
    <header class="panel-head"><h2 id="panel-users-title" class="panel-title">Users</h2><span id="users-count" class="panel-count" hidden></span></header>
    <div id="users-body" class="panel-body"></div>
  </section>
  <section id="panel-here" class="panel" data-size="full" aria-labelledby="panel-here-title" hidden>
    <header class="panel-head"><h2 id="panel-here-title" class="panel-title">No login on this device</h2></header>
    <div id="here-body" class="panel-body"></div>
  </section>
</main>
<script src="app.js"></script>
<script src="head.js"></script>
<script src="boot.js"></script>
<script src="account.js"></script>
</body>
</html>
