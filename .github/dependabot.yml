# Weekly version updates: the GitHub Actions the workflows use (pinned by commit, the tag in a comment), the npm
# packages of the root and of docs/demo/, and the Board's Python packages (.claude/scripts/requirements.txt).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # TypeScript stays on 6.x: .claude/hooks/new-test-file-guard.sh needs TypeScript's classic JavaScript API
    # (ts.createSourceFile), which TypeScript 7 does not have. Remove this when TypeScript publishes a stable API for 7.
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
  - package-ecosystem: npm
    directory: /docs/demo
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /.claude/scripts
    schedule:
      interval: weekly
